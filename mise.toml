[tasks.webapp]
description = "Build, configure and verify private authenticated Webapp on loopback"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: webapp: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
cd / # target users cannot traverse the administrator home
action=${HERMES_SETUP_WEBAPP_ACTION:-on}
[[ "$action" == on || "$action" == off ]]
sudo -v
url=
if [[ "$action" == on ]]; then
url=$(sudo tailscale status --json | python3 -c 'import sys,json,re; s=json.load(sys.stdin); n=s["Self"]["DNSName"].rstrip("."); assert s["BackendState"]=="Running" and re.fullmatch(r"[a-zA-Z0-9.-]+\.ts\.net",n), "Tailscale not ready"; print("https://hermes-web."+n.split(".",1)[1])')
echo "Webapp origin: $url"
fi
hermes_cmd() {
  local uid
  uid=$(id -u "$HERMES_USER") || return 1
  sudo -H -u "$HERMES_USER" -- env XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" bash -c 'set -euo pipefail; export PATH="$HOME/.local/bin:$PATH"; cd "$HOME"; exec "$@"' _ "$@"
}
webapp_ready() {
  local status rc=0 listeners
  status=$(hermes_cmd timeout 25 hermes webapp --status 2>&1) || rc=$?
  printf '%s\n' "$status"
  # Some CLI releases return success even when the Webapp is unavailable.
  if (( rc != 0 )) || ! grep -Eq '^Serving at[[:space:]]' <<< "$status" || grep -Eq '^Unavailable:' <<< "$status"; then
    echo "Webapp status not ready (exit=$rc)" >&2; return 1
  fi
  listeners=$(ss -H -lnt "sport = :$WEB_PORT") || return 1
  if ! awk -v p="127.0.0.1:$WEB_PORT" '$4==p {ok=1} $4!=p {bad=1} END {exit !(ok&&!bad)}' <<< "$listeners"; then
    echo 'Expected an exclusive IPv4 loopback listener:' >&2; printf '%s\n' "$listeners" >&2; return 1
  fi
  local probe
  probe=$(curl --noproxy '*' --silent --show-error --connect-timeout 3 --max-time 8 --output /dev/null --write-out '%{http_code}\n%{redirect_url}' "http://127.0.0.1:$WEB_PORT/" -H "Host: ${url#https://}" -H "X-Forwarded-Proto: https") || return 1
  python3 - "$probe" <<'PYLOGIN'
import sys,urllib.parse
lines=sys.argv[1].splitlines(); code=lines[0] if lines else ''
url=urllib.parse.urlsplit(lines[1] if len(lines)>1 else '')
if code not in ('301','302','303','307','308') or url.path!='/login':
