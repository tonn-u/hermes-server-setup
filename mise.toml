#!/usr/bin/python3
# v5.0: one-way publication, no work-tree filters or client synchronization.
import fnmatch, os, pathlib, stat, subprocess, sys, tarfile, tempfile, shlex
from datetime import datetime, timezone

BLOCKED = {'secrets','credentials','rag-index','thumbs.db','desktop.ini','id_rsa','id_ed25519','id_dsa','id_ecdsa','authorized_keys','known_hosts'}
PATTERNS = ('~syncthing~*','*.pem','*.key','*.p12','*.pfx','*.ppk','*.kdbx','*.jks','*.keystore','*.gpg','*.asc','*.token','*.secret','*.credentials')
LIMIT = 50*1024*1024
TOTAL = 512*1024*1024

def excluded(name):
    s=name.casefold()
    return s.startswith('.') or s in BLOCKED or any(fnmatch.fnmatchcase(s,p) for p in PATTERNS)

def safe_path(name):
    p=pathlib.PurePosixPath(name)
    if not name or p.is_absolute() or str(p)!=name or any(x in ('','..','.') or excluded(x) for x in p.parts) or '\\' in name or any(ord(c)<32 or ord(c)==127 for c in name):
        raise ValueError('Unsafe or excluded path: '+repr(name))
    name.encode('utf-8','strict')
    return name

def fingerprint(s):
    return (s.st_dev,s.st_ino,s.st_mode,s.st_uid,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns)

def scan(root):
    def fail(e): raise e
    for base,dirs,files,dfd in os.fwalk(root,topdown=True,onerror=fail,follow_symlinks=False):
        dirs[:]=sorted(d for d in dirs if not excluded(d))
        for name in dirs+sorted(n for n in files if not excluded(n)):
            rel=safe_path(os.path.relpath(os.path.join(base,name),root))
            s=os.stat(name,dir_fd=dfd,follow_symlinks=False)
            if name in dirs:
                if not stat.S_ISDIR(s.st_mode): raise ValueError('Not a real directory: '+rel)
                continue
            if not stat.S_ISREG(s.st_mode) or s.st_nlink!=1: raise ValueError('Not a plain standalone file: '+rel)
            if s.st_size>LIMIT: raise ValueError('File exceeds 50 MiB: '+rel)
            yield rel,dfd,name,s

def export(root, target):
    if not stat.S_ISDIR(os.lstat(root).st_mode): raise ValueError('KB root must be a directory')
    target=pathlib.Path(target); seen={}; size=0; fd,tmp=tempfile.mkstemp(prefix='.export-',dir=target.parent)
    try:
        with os.fdopen(fd,'wb') as out:
            with tarfile.open(fileobj=out,mode='w',format=tarfile.PAX_FORMAT) as t:
                for rel,dfd,name,s in scan(root):
                    size+=s.st_size
                    if size>TOTAL: raise ValueError('KB export exceeds 512 MiB')
                    with os.fdopen(os.open(name,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=dfd),'rb') as f:
                        before=fingerprint(os.fstat(f.fileno()))
                        if before!=fingerprint(s): raise ValueError('File changed before export: '+rel)
                        info=tarfile.TarInfo(rel); info.size=s.st_size; info.mode=0o644
                        t.addfile(info,f)
                        if fingerprint(os.fstat(f.fileno()))!=before: raise ValueError('File changed while exporting: '+rel)
                        seen[rel]=before
            if seen!={rel:fingerprint(s) for rel,_,__,s in scan(root)}: raise ValueError('KB changed during export; retry')
            if 'README.md' not in seen: raise ValueError('README.md absent; refusing an unintended empty publication')
            out.flush(); os.fchmod(out.fileno(),0o640); os.fsync(out.fileno())
        os.replace(tmp,target)
    finally:
        if os.path.exists(tmp): os.unlink(tmp)
    print(f'OK: exported {len(seen)} files, {size} bytes')

def git_env():
    return {**{k:v for k,v in os.environ.items() if not k.startswith('GIT_')},'GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':'/dev/null','GIT_TERMINAL_PROMPT':'0','GIT_NO_REPLACE_OBJECTS':'1','LC_ALL':'C','GIT_AUTHOR_NAME':'ADLC Ubuntu Server','GIT_AUTHOR_EMAIL':'adlc-backup@users.noreply.github.com','GIT_COMMITTER_NAME':'ADLC Ubuntu Server','GIT_COMMITTER_EMAIL':'adlc-backup@users.noreply.github.com'}

SSH='ssh -F /dev/null -i /var/lib/kb-backup/.ssh/github_adlc -o IdentityAgent=none -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=/var/lib/kb-backup/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15'

def git(repo,*args,data=None,env=None,check=True):
    r=subprocess.run(['git','--no-replace-objects','--git-dir='+str(repo),'-c','core.hooksPath=/dev/null','-c','commit.gpgsign=false','-c','core.sshCommand='+SSH,*args],input=data,stdout=subprocess.PIPE,env=env or git_env(),cwd='/',check=check)
    return r.stdout

def remote_url(repo):
    import re
    x=git(repo,'config','--local','--get-all','remote.origin.url').decode().strip()
    if not re.fullmatch(r'git@github\.com:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git',x): raise ValueError('Invalid or multiple GitHub remote URLs')
    if git(repo,'remote','get-url','--push','--all','origin').decode().strip()!=x or git(repo,'remote','get-url','--all','origin').decode().strip()!=x: raise ValueError('Rewritten or alternate remote URL')
    for line in git(repo,'config','--null','--list').split(b'\0'):
        k=line.split(b'\n',1)[0].lower()
        if k.startswith((b'include.',b'includeif.',b'url.')) or k in (b'remote.origin.pushurl',b'remote.origin.receivepack',b'remote.origin.uploadpack'):
            raise ValueError('Unexpected Git configuration: '+repr(k))
    return x

def head(repo):
    r=subprocess.run(['git','--git-dir='+str(repo),'show-ref','--verify','--hash','refs/heads/main'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=git_env(),cwd='/')
    if r.returncode==0: return r.stdout.decode().strip()
    if r.returncode!=128 and r.returncode!=1: raise ValueError('Cannot read local branch main')
    # Distinguish absent main from a damaged or unexpected existing branch history.
    refs=git(repo,'for-each-ref','--format=%(refname)','refs/heads').decode().splitlines()
    if refs: raise ValueError('Local main is missing but other branches exist')
    return ''

def audit_history(repo,rev):
    if not rev:return
    for commit in set(git(repo,'log','--format=%T',rev).decode().splitlines()):
        for entry in git(repo,'ls-tree','-rz',commit).split(b'\0'):
            if not entry: continue
            meta,path=entry.split(b'\t',1)
            safe_path(path.decode('utf-8','strict'))
            if not meta.startswith((b'100644 blob ',b'100755 blob ')):raise ValueError('Existing commit contains non-regular file')

def make_commit(repo, archive):
    previous=head(repo); audit_history(repo,previous)
    # New index from raw byte blobs. No git add, line-ending conversion, attributes, or LFS filters.
    with tempfile.TemporaryDirectory(prefix='snapshot-') as tmp:
        env={**git_env(),'GIT_INDEX_FILE':os.path.join(tmp,'index')}; rows=[]; seen=set(); total=0
        git(repo,'read-tree','--empty',env=env)
        archive_fd=os.open(archive,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
        with os.fdopen(archive_fd,'rb') as src, tarfile.open(fileobj=src,mode='r:') as t:
            if not stat.S_ISREG(os.fstat(src.fileno()).st_mode):raise ValueError('Export is not a regular archive')
            for m in t:
                name=safe_path(m.name)
                if not m.isfile() or name in seen or m.size>LIMIT or m.size<0: raise ValueError('Invalid archive member: '+name)
                total+=m.size
                if total>TOTAL:raise ValueError('Export exceeds 512 MiB')
                seen.add(name)
                with t.extractfile(m) as f: data=f.read()
                if len(data)!=m.size:raise ValueError('Truncated archive file: '+name)
                oid=git(repo,'hash-object','-w','--stdin',data=data,env=env).strip()
                rows.append(b'100644 '+oid+b'\t'+name.encode()+b'\0')
        if 'README.md' not in seen:raise ValueError('Missing README.md; no publication')
        git(repo,'update-index','-z','--index-info',data=b''.join(rows),env=env)
        tree=git(repo,'write-tree',env=env).decode().strip()
        if previous and git(repo,'rev-parse',previous+'^{tree}').decode().strip()==tree:
            print('OK: unchanged KB, no new commit');return previous
        args=['commit-tree',tree]
        if previous:args+=['-p',previous]
        new=git(repo,*args,'-m','KB snapshot '+datetime.now(timezone.utc).isoformat(),env=env).decode().strip()
        git(repo,'update-ref','refs/heads/main',new,previous or '0'*len(new))
        print('OK: local snapshot '+new);return new

def remote_head(repo,url):
    out=git(repo,'ls-remote','--refs',url,'refs/heads/main').decode().strip()
    if not out:return ''
    fields=out.split()
    if len(fields)!=2 or fields[1]!='refs/heads/main':raise ValueError('Unexpected remote main')
    return fields[0]

def publish(repo,archive):
    url=remote_url(repo); previous=head(repo); remote=remote_head(repo,url)
    if not remote and previous:
        # A completed publication records this ref. Never recreate a branch deleted upstream.
        marker=subprocess.run(['git','--git-dir='+str(repo),'show-ref','--verify','--quiet','refs/hermes-publish/last-remote'],env=git_env(),cwd='/')
        if marker.returncode==0: raise ValueError('Published remote main has disappeared; inspect repository and recovery plan')
        if marker.returncode!=1: raise ValueError('Cannot inspect last publication marker')
    if remote:
        if not previous:raise ValueError('Remote main exists but local main is absent; refusing to overwrite')
        git(repo,'merge-base','--is-ancestor',remote,previous)
    elif not previous and git(repo,'ls-remote','--refs',url).strip():raise ValueError('New remote is not empty')
    new=make_commit(repo,archive)
    git(repo,'-c','push.followTags=false','push','--no-follow-tags',url,'refs/heads/main:refs/heads/main')
    if remote_head(repo,url)!=new:raise ValueError('Remote main does not equal local main after push')
    git(repo,'update-ref','refs/hermes-publish/last-remote',new)
    print('OK: GitHub main published '+new)

def verify(repo):
    url=remote_url(repo); local=head(repo)
    if not local:raise ValueError('No local main')
    audit_history(repo,local)
    if remote_head(repo,url)!=local:raise ValueError('Local and remote main differ; run kb-backup-now, never force-push')
    print('OK: local and remote main match '+local)

if __name__=='__main__':
    try:
        mode=sys.argv[1]
        if mode=='export' and len(sys.argv)==4:export(*sys.argv[2:])
        elif mode=='publish' and len(sys.argv)==4:publish(*sys.argv[2:])
        elif mode=='verify' and len(sys.argv)==3:verify(sys.argv[2])
        else:raise ValueError('Invalid publication command')
    except (OSError,ValueError,RuntimeError,UnicodeError,tarfile.TarError,subprocess.CalledProcessError) as e:raise SystemExit('FAIL: KB publication: '+str(e))
PYPUBLISH
cat > "$tmp/export.service" <<'UNIT'
[Unit]
Description=Export a private KB snapshot as Hermes
[Service]
Type=oneshot
User=hermes
Group=kb-backup
UMask=0027
ExecStart=/usr/local/libexec/hermes-kb-publish export /srv/knowledge /var/lib/hermes-kb-export/snapshot.tar
TimeoutStartSec=3min
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/hermes-kb-export
UNIT
cat > "$tmp/publish.service" <<'UNIT'
[Unit]
Description=Publish ADLC KB snapshot to private GitHub repository
After=network-online.target hermes-kb-export.service
Wants=network-online.target
Requires=hermes-kb-export.service
[Service]
Type=oneshot
User=kb-backup
Group=kb-backup
UMask=0077
ExecStart=/usr/local/libexec/hermes-kb-publish publish /var/lib/kb-backup/repo.git /var/lib/hermes-kb-export/snapshot.tar
TimeoutStartSec=4min
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
InaccessiblePaths=/srv/knowledge
ReadWritePaths=/var/lib/kb-backup
UNIT
cat > "$tmp/timer" <<'UNIT'
[Unit]
Description=Publish ADLC KB every five minutes
[Timer]
OnCalendar=*-*-* *:00/5:00
Persistent=true
[Install]
WantedBy=timers.target
UNIT
script=/usr/local/libexec/hermes-kb-publish
export_unit=/etc/systemd/system/hermes-kb-export.service
service=/etc/systemd/system/hermes-kb-backup.service
timer=/etc/systemd/system/hermes-kb-backup.timer
for p in "$script" "$export_unit" "$service" "$timer"; do sudo test ! -L "$p" || { echo "FAIL: managed symlink $p" >&2; exit 1; }; done
same() { sudo cmp -s "$1" "$2" && [[ $(sudo stat -c '%u:%g:%a' "$2") == "0:0:$3" ]]; }
if [[ -n "$old" ]] && same "$tmp/publish.py" "$script" 755 && same "$tmp/export.service" "$export_unit" 644 && same "$tmp/publish.service" "$service" 644 && same "$tmp/timer" "$timer" 644 && sudo systemctl is-enabled --quiet hermes-kb-backup.timer && sudo systemctl is-active --quiet hermes-kb-backup.timer; then
  echo 'OK: publication already configured; no config write, service stop, restart or push. Use kb-verify for remote verification.'; exit 0
fi
if [[ -n "$old" ]]; then
  remote=$old; printf 'Existing GitHub remote: %s\n' "$remote"
else
  read -r -p 'Private EMPTY repository SSH URL (git@github.com:OWNER/REPO.git): ' remote
fi
[[ "$remote" =~ ^git@github\.com:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$ ]] || { echo 'FAIL: invalid remote URL' >&2; exit 1; }
read -r -p 'Confirmed correct PRIVATE repository and KB contains no secrets? Type YES: ' answer
[[ "$answer" == YES ]]
refs=$(sudo -H -u kb-backup env GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_SSH_COMMAND="$sshcmd" git ls-remote --refs "$remote")
if [[ -z "$old" && -n "$refs" ]]; then echo 'FAIL: new remote is not empty; use a new private empty repo' >&2; exit 1; fi
python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read())' "$tmp/publish.py"
# Stop outdated or changed publication before changing configuration. On failure leave timer OFF,
# never resume the older unsafe publisher. Retain local repo, deploy key and existing history for retry.
if sudo systemctl is-active --quiet hermes-kb-backup.timer; then sudo systemctl stop hermes-kb-backup.timer; fi
if sudo systemctl is-enabled --quiet hermes-kb-backup.timer; then sudo systemctl disable hermes-kb-backup.timer; fi
for u in hermes-kb-backup.service hermes-kb-export.service; do
  state=$(sudo systemctl show "$u" -p ActiveState --value)
  if [[ "$state" != inactive && "$state" != failed ]]; then echo "FAIL: $u still running; timer stopped, retry once service finishes" >&2; exit 1; fi
done
if ! sudo test -f "$repo/HEAD"; then sudo -H -u kb-backup git init --bare -b main "$repo"; fi
bound=$("${G[@]}" config --local --get-all remote.origin.url || true)
[[ -z "$bound" || "$bound" == "$remote" ]] || { echo 'FAIL: remote changed, refusing' >&2; exit 1; }
if [[ -z "$bound" ]]; then "${G[@]}" config --local remote.origin.url "$remote"; fi
sudo install -d -m 755 /usr/local/libexec
install_changed() {
  local from=$1 to=$2 mode=$3 stage
  if same "$from" "$to" "$mode"; then return 0; fi
  stage=$(sudo mktemp "$to.new.XXXXXX")
  sudo install -o root -g root -m "$mode" "$from" "$stage" && sudo mv -f -- "$stage" "$to" || { sudo rm -f -- "$stage"; return 1; }
}
install_changed "$tmp/publish.py" "$script" 755
install_changed "$tmp/export.service" "$export_unit" 644
install_changed "$tmp/publish.service" "$service" 644
install_changed "$tmp/timer" "$timer" 644
sudo systemd-analyze verify "$export_unit" "$service" "$timer"
sudo systemctl daemon-reload
# A failed start leaves the timer disabled. Re-running this same setup retries the first push.
if ! sudo systemctl start hermes-kb-backup.service; then sudo journalctl -u hermes-kb-export.service -u hermes-kb-backup.service -n 35 --no-pager; echo 'FAIL: publication timer remains disabled; local history retained. Fix specific error and repeat kb-git-setup.' >&2; exit 1; fi
sudo systemctl enable --now hermes-kb-backup.timer
sudo systemctl list-timers hermes-kb-backup.timer
'''

[tasks.kb-backup-now]
description = "Run GitHub snapshot on demand"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: kb-backup-now: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]]
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
sudo systemctl start hermes-kb-backup.service
sudo journalctl -u hermes-kb-backup.service -n 20 --no-pager
'''

[tasks.kb-verify]
description = "Verify GitHub publication after setup, private KB and isolated key"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: kb-verify: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
cd /
[[ -z $(getent group kb-backup | cut -d: -f4) && $(getent passwd | awk -F: -v g="$(id -g kb-backup)" '$4==g {print $1}') == kb-backup ]] || { echo 'FAIL: publisher group shared' >&2; exit 1; }
[[ $(sudo stat -c '%U:%a' /srv/knowledge) == hermes:700 ]] || { echo 'FAIL: live KB owner/mode' >&2; exit 1; }
[[ $(sudo stat -c '%U:%G:%a' /var/lib/hermes-kb-export) == hermes:kb-backup:2750 ]] || { echo 'FAIL: snapshot directory permissions' >&2; exit 1; }
sudo -u hermes python3 -c 'import os; p="/srv/knowledge"; assert os.access(p,os.R_OK|os.W_OK|os.X_OK); open(p+"/README.md","rb").read(1); print("OK: Hermes KB access")'
sudo -u kb-backup python3 -c 'import os; assert not os.access("/srv/knowledge",os.X_OK); assert not os.access("/var/lib/hermes-kb-export",os.W_OK); print("OK: isolated publisher")'
sudo -u hermes python3 -c 'import os; assert not os.access("/var/lib/kb-backup/.ssh/github_adlc",os.R_OK); print("OK: deploy key inaccessible to agent")'
ports=$(sudo ss -H -lntup '( sport = :22000 or sport = :8384 or sport = :21027 )')
[[ -z "$ports" ]] || { printf 'FAIL: legacy sync listener exists:\n%s\n' "$ports" >&2; exit 1; }
for u in hermes-kb-sync.service hermes-kb-acl-kb-sync.timer hermes-kb-acl-hermes.timer hermes-kb-firewall.service; do
  if sudo systemctl is-active --quiet "$u" || sudo systemctl is-enabled --quiet "$u" 2>/dev/null; then echo "FAIL: obsolete unit $u still active/enabled" >&2; exit 1; fi
done
sudo systemctl is-enabled --quiet hermes-kb-backup.timer
sudo systemctl is-active --quiet hermes-kb-backup.timer
[[ $(sudo systemctl show hermes-kb-backup.service -p User --value) == kb-backup ]]
[[ $(sudo systemctl show hermes-kb-export.service -p User --value) == hermes ]]
sudo systemctl show hermes-kb-backup.service -p ExecStart --value | grep -Fq '/usr/local/libexec/hermes-kb-publish publish'
sudo systemctl show hermes-kb-export.service -p ExecStart --value | grep -Fq '/usr/local/libexec/hermes-kb-publish export'
for u in hermes-kb-export.service hermes-kb-backup.service; do
  [[ $(sudo systemctl show "$u" -p Result --value) == success ]] || { echo "FAIL: $u result not success; see journalctl" >&2; exit 1; }
done
sudo -H -u kb-backup /usr/local/libexec/hermes-kb-publish verify /var/lib/kb-backup/repo.git
sudo systemctl list-timers hermes-kb-backup.timer
echo 'OK: live KB isolated; latest local commit and remote main match. Check private visibility in GitHub UI.'
'''

