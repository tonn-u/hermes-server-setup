umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
if sudo systemctl is-active --quiet hermes-ssh-rollback.timer || sudo test -d /run/hermes-ssh-stage; then
  echo 'Resolve staged SSH firewall before reboot' >&2
  exit 1
fi
read -r -p 'Verified key access and ready to reboot? Type YES: ' answer
[[ "$answer" == YES ]]
sudo reboot
'''

