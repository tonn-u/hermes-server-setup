[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
cd / # target users cannot traverse the administrator home
[[ "${HERMES_SETUP_SELECT_MODEL:-0}" =~ ^[01]$ ]]
uid=$(id -u "$HERMES_USER")
sudo -H -u "$HERMES_USER" -- env XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" bash -c 'set -euo pipefail; export PATH="$HOME/.local/bin:$PATH"; cd "$HOME"; if [[ "$1" == 1 ]]; then hermes model; fi; if ! hermes doctor; then echo "WARNING: doctor found issues; review its output. Testing inference separately." >&2; fi; answer=$(timeout 180 hermes chat -Q -q "Reply with exactly OK. Do not use tools." </dev/null); if ! grep -Eq "^[[:space:]]*OK[.!]?[[:space:]]*$" <<< "$answer"; then echo "LLM smoke test did not return OK:" >&2; printf "%s\n" "$answer" >&2; exit 1; fi; echo "OK: LLM one-shot inference"' _ "${HERMES_SETUP_SELECT_MODEL:-0}"
'''

