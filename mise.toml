[tasks.kb-storage]
description = "Create private Hermes-owned knowledge base; migrate old storage if present"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: kb-storage: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
[[ "$HERMES_USER" == hermes ]] || { echo 'FAIL: v5 requires HERMES_USER=hermes' >&2; exit 1; }
cd /
# Reuse the isolated publisher account and its existing deploy key, if present.
if ! id kb-backup >/dev/null 2>&1; then sudo useradd --system --user-group --create-home --home-dir /var/lib/kb-backup --shell /usr/sbin/nologin kb-backup; fi
[[ $(getent passwd kb-backup | cut -d: -f6) == /var/lib/kb-backup && $(id -gn kb-backup) == kb-backup ]] || { echo 'FAIL: unexpected publisher identity' >&2; exit 1; }
[[ -z $(getent group kb-backup | cut -d: -f4) && $(getent passwd | awk -F: -v g="$(id -g kb-backup)" '$4==g {print $1}') == kb-backup ]] || { echo 'FAIL: publisher group is shared with another account' >&2; exit 1; }
for account in hermes kb-backup; do
  groups=$(id -nG "$account")
  for g in $groups; do case "$g" in sudo|admin|wheel|docker|lxd|incus|disk|adm|libvirt|shadow) echo "FAIL: unsafe group $g for $account" >&2; exit 1;; esac; done
  sudo -v; rc=0; out=$(LC_ALL=C sudo -n -l -U "$account" 2>&1) || rc=$?
  if [[ "$out" != "User $account is not allowed to run sudo on "*"." || "$out" == *$'\n'* || ( "$rc" != 0 && "$rc" != 1 ) ]]; then printf 'FAIL: cannot confirm no sudo for %s\n%s\n' "$account" "$out" >&2; exit 1; fi
  echo "OK: $account has no sudo rights"
done
sudo test ! -L /var/lib/kb-backup
if [[ $(sudo stat -c '%U:%G:%a' /var/lib/kb-backup) != kb-backup:kb-backup:700 ]]; then sudo chmod 700 /var/lib/kb-backup; fi
[[ $(sudo stat -c '%U:%G:%a' /var/lib/kb-backup) == kb-backup:kb-backup:700 ]] || { echo 'FAIL: unexpected publisher home owner/group' >&2; exit 1; }
sudo test ! -L /srv/knowledge
if ! sudo test -e /srv/knowledge; then sudo install -d -o hermes -g "$(id -gn hermes)" -m 0700 /srv/knowledge; fi
owner=$(sudo stat -c %U /srv/knowledge)
if [[ "$owner" == kb-sync ]]; then
  # The old writer must be stopped before transferring ownership. Never delete the old KB.
  for service in hermes-kb-sync.service hermes-kb-acl-kb-sync.service hermes-kb-acl-hermes.service hermes-kb-acl-kb-sync.timer hermes-kb-acl-hermes.timer hermes-kb-backup.timer hermes-kb-backup.service hermes-kb-export.service; do
    state=$(sudo systemctl show "$service" -p ActiveState --value)
    [[ "$state" == inactive || "$state" == failed ]] || { echo "Stop legacy unit or wait for the current job: $service ($state)" >&2; exit 1; }
  done
  read -r -p 'Legacy KB: close all Hermes CLI/chat writes now. Transfer existing files to hermes (no deletion)? Type YES: ' answer
  [[ "$answer" == YES ]]
  uid=$(id -u hermes)
  h() { sudo -H -u hermes env XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" systemctl --user "$@"; }
