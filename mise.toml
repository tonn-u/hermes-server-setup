    if stat.S_IMODE(os.fstat(fd).st_mode)!=mode:os.fchmod(fd,mode)
print('OK: old KB transferred to hermes; bytes and file names unchanged')
PYMIGRATE
  if (( was_active )); then h start hermes-gateway.service; fi
  trap - EXIT
elif [[ "$owner" != hermes ]]; then echo "FAIL: unexpected KB owner $owner; not changing it" >&2; exit 1
fi
# Private root protects all descendants, irrespective of former per-file ACLs.
