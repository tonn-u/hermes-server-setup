print('OK: Hermes owns the private KB and can read README.md')
PYREADME
sudo test ! -L /var/lib/hermes-kb-export
if ! sudo test -e /var/lib/hermes-kb-export; then sudo install -d -o hermes -g kb-backup -m 2750 /var/lib/hermes-kb-export; fi
[[ $(sudo stat -c '%U:%G:%a' /var/lib/hermes-kb-export) == hermes:kb-backup:2750 ]] || { echo 'FAIL: unexpected export-directory ownership/mode; no changes made to it' >&2; exit 1; }
sudo -u kb-backup python3 -c 'import os; assert not os.access("/srv/knowledge",os.R_OK|os.X_OK), "publisher can access live KB"; assert not os.access("/var/lib/hermes-kb-export",os.W_OK), "publisher can modify staging directory"; print("OK: publisher cannot read live KB or modify staging directory")'
echo 'OK: /srv/knowledge ready; no synchronization software needed.'
'''

