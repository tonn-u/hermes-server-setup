  if h is-active --quiet hermes-gateway.service; then was_active=1; h stop hermes-gateway.service; fi
  restore_gateway() { local rc=$?; trap - EXIT; if (( was_active )); then h start hermes-gateway.service || { echo 'FAIL: gateway restart failed; run mise run gateway' >&2; rc=1; }; fi; exit "$rc"; }
  trap restore_gateway EXIT
  sudo python3 - <<'PYMIGRATE'
import os,pwd,stat,errno
root='/srv/knowledge'; u=pwd.getpwnam('hermes'); old=pwd.getpwnam('kb-sync').pw_uid
device=os.stat(root,follow_symlinks=False).st_dev

def check(s,path):
    if s.st_dev!=device or s.st_uid not in (u.pw_uid,old) or not (stat.S_ISDIR(s.st_mode) or (stat.S_ISREG(s.st_mode) and s.st_nlink==1)):
        raise RuntimeError('Refuse migration of unexpected owner/type/link: '+path)
def entries():
    def fail(e):raise e
    for path,dirs,files,dfd in os.fwalk(root,topdown=False,follow_symlinks=False,onerror=fail):
        for n in dirs+files:
            s=os.stat(n,dir_fd=dfd,follow_symlinks=False); p=os.path.join(path,n); check(s,p)
            fd=os.open(n,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK|(os.O_DIRECTORY if stat.S_ISDIR(s.st_mode) else 0),dir_fd=dfd)
