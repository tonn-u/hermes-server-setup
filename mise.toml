            finally:os.close(fd)
    fd=os.open(root,os.O_RDONLY|os.O_NOFOLLOW|os.O_DIRECTORY)
    try:
        s=os.fstat(fd);check(s,root);yield fd,s,root
    finally:os.close(fd)
# First pass is non-mutating. Second pass transfers only known old ownership, bottom-up; rerunnable if interrupted.
for _ in entries():pass
for fd,s,p in entries():
    if s.st_uid!=u.pw_uid or s.st_gid!=u.pw_gid:os.fchown(fd,u.pw_uid,u.pw_gid)
    for attr in ('system.posix_acl_access','system.posix_acl_default'):
