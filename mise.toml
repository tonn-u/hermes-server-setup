# Hermes Agent setup for a dedicated Ubuntu Server.
# Set the administrator and network values for your server before running tasks.
[env]
ADMIN_USER = "admin"
HERMES_USER = "hermes"
LAN_IF = "eth0"
LAN_NET = "192.168.1.0/24"
TAILSCALE_TAG = "tag:agent-server"
WEB_PORT = "9120"

[tasks.preflight]
description = "Inspect OS, identity, storage and LAN"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: preflight: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
source /etc/os-release
[[ "${ID:-}" == ubuntu && -d /run/systemd/system ]] || { echo 'Ubuntu with systemd is required' >&2; exit 1; }
[[ "$HERMES_USER" == hermes && "$ADMIN_USER" != hermes && "$WEB_PORT" == 9120 ]] || { echo 'This runbook uses the dedicated hermes account and fixed Webapp port 9120' >&2; exit 1; }
python3 -c 'import tomllib'
cat /etc/os-release
uname -m
id
sudo -v
ip -br -4 addr
ip -4 route
free -h
df -h /
case "$(uname -m)" in aarch64|x86_64) ;; *) echo "Unsupported architecture" >&2; exit 1;; esac
'''

[tasks.packages]
description = "Install OS dependencies and security updates"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: packages: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
read -r -p 'Install Hermes OS packages and enable unattended security updates? Type YES: ' answer
[[ "$answer" == YES ]]
sudo apt-get update
sudo apt-get install -y curl git ca-certificates openssl libatomic1 build-essential python3 python3-venv python3-yaml nftables openssh-server unattended-upgrades nano htop tmux jq
want=$(printf '%s\n' 'APT::Periodic::Update-Package-Lists "1";' 'APT::Periodic::Unattended-Upgrade "1";')
if [[ $(sudo cat /etc/apt/apt.conf.d/99-mise-hermes-periodic 2>/dev/null || true) != "$want" ]]; then printf '%s\n' "$want" | sudo tee /etc/apt/apt.conf.d/99-mise-hermes-periodic >/dev/null; fi
sudo systemctl enable --now apt-daily.timer apt-daily-upgrade.timer
if [[ -e /run/reboot-required ]]; then echo 'Reboot required: run mise run reboot separately.'; fi
'''

[tasks.ssh-key]
description = "Optional: append an OpenSSH Ed25519 public key"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: ssh-key: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
umask 077
read -r -p 'Paste public key (ssh-ed25519 ...): ' key
[[ "$key" == ssh-ed25519\ * ]]
tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
printf '%s\n' "$key" > "$tmp"
ssh-keygen -l -f "$tmp"
[[ ! -L "$HOME/.ssh" && ! -L "$HOME/.ssh/authorized_keys" ]] || { echo 'Unexpected SSH directory/file symlink' >&2; exit 1; }
install -d -m 700 "$HOME/.ssh"
touch "$HOME/.ssh/authorized_keys"
chmod 600 "$HOME/.ssh/authorized_keys"
blob=$(awk '{print $2}' <<< "$key")
awk -v blob="$blob" '{for(i=1;i<NF;i++) if($i=="ssh-ed25519" && $(i+1)==blob) found=1} END {exit !found}' "$HOME/.ssh/authorized_keys" || printf '\n%s\n' "$key" >> "$HOME/.ssh/authorized_keys"
echo 'Test a NEW SSH session with the private key before ssh-harden.'
'''

[tasks.ssh-harden]
description = "Require public-key SSH; preserve existing session"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: ssh-harden: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
[[ -s "$HOME/.ssh/authorized_keys" ]] || { echo 'No authorized_keys'; exit 1; }
sudo bash -s -- "$ADMIN_USER" "${SSH_CONNECTION:-}" <<'ROOT'
set -Eeuo pipefail
admin=$1; connection=$2
systemctl is-active --quiet ssh.service || { echo 'Start and test ssh.service before hardening; inspect ssh.socket separately.' >&2; exit 1; }
f=/etc/ssh/sshd_config.d/00-mise-hermes.conf
[[ ! -L "$f" ]] || { echo 'FAIL: managed SSH config is a symlink' >&2; exit 1; }
tmp=$(mktemp -d /etc/ssh/sshd_config.d/.mise-hermes.XXXXXX)
trap 'rm -rf -- "$tmp"' EXIT
cat > "$tmp/wanted" <<EOF
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
X11Forwarding no
AllowAgentForwarding no
EOF
if [[ -f "$f" ]] && grep -Fxq "AllowUsers $admin" "$f"; then printf '%s\n' "AllowUsers $admin" >> "$tmp/wanted"; fi
validate() {
  local cfg rootcfg peer peerport localaddr port key line
  /usr/sbin/sshd -t || return 1
  if [[ -n "$connection" ]]; then
    read -r peer peerport localaddr port <<< "$connection"
    cfg=$(/usr/sbin/sshd -T -C "user=$admin,host=$peer,addr=$peer,laddr=$localaddr,lport=$port" | LC_ALL=C awk 'NF {$1=tolower($1); print}') || return 1
    rootcfg=$(/usr/sbin/sshd -T -C "user=root,host=$peer,addr=$peer,laddr=$localaddr,lport=$port" | LC_ALL=C awk 'NF {$1=tolower($1); print}') || return 1
  else
    cfg=$(/usr/sbin/sshd -T | LC_ALL=C awk 'NF {$1=tolower($1); print}') || return 1
    rootcfg=$cfg
  fi
  for line in 'permitrootlogin no' 'pubkeyauthentication yes' 'passwordauthentication no' 'kbdinteractiveauthentication no' 'authenticationmethods publickey' 'permitemptypasswords no' 'maxauthtries 3' 'x11forwarding no' 'allowagentforwarding no'; do
    grep -Fxq "$line" <<< "$cfg" || { echo "Effective setting differs: $line" >&2; return 1; }
  done
  if grep -Fxq "AllowUsers $admin" "$tmp/wanted"; then grep -Fxq "allowusers $admin" <<< "$cfg" || return 1; fi
  grep -Fxq 'permitrootlogin no' <<< "$rootcfg" || return 1
}
if [[ -f "$f" ]] && cmp -s "$tmp/wanted" "$f" && [[ $(stat -c '%u:%g:%a' "$f") == 0:0:644 ]]; then
  validate || { echo 'FAIL: existing managed SSH file matches but effective configuration differs; inspect other directives.' >&2; exit 1; }
  echo 'OK: SSH hardening already matches; no reload or config write.'; exit 0
fi
read -r -p 'Have you tested a second key-only SSH session? Type YES: ' answer </dev/tty
[[ "$answer" == YES ]]
had=0; applied=0
if [[ -f "$f" ]]; then cp -p "$f" "$tmp/backup"; had=1; fi
rollback() {
  local rc=$?; trap - EXIT
  if (( rc && applied )); then
    if (( had )); then mv -f -- "$tmp/backup" "$f"; else rm -f -- "$f"; fi
    /usr/sbin/sshd -t && systemctl reload ssh.service || { echo "FAIL: SSH rollback reload failed; use existing SSH/console; backup directory $tmp" >&2; exit "$rc"; }
  fi
  rm -rf -- "$tmp"; exit "$rc"
}
trap rollback EXIT
chmod 644 "$tmp/wanted"
chown root:root "$tmp/wanted"
mv -f -- "$tmp/wanted" "$f"; applied=1
validate
systemctl reload ssh.service
ROOT
echo 'Open a new LAN SSH session before closing this one. Test password rejection.'
'''

