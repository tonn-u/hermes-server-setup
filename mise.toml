[tasks.gateway]
description = "Install/enable/start Hermes user gateway"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: gateway: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
cd / # target users cannot traverse the administrator home
uid=$(id -u "$HERMES_USER")
if [[ $(systemctl show hermes-gateway.service -p LoadState --value) != not-found ]]; then
  echo 'A system-scope Hermes gateway unit already exists; reconcile scope before using the user unit.' >&2
  exit 1
fi
restart=${HERMES_SETUP_RESTART_GATEWAY:-0}
[[ "$restart" == 0 || "$restart" == 1 ]]
sudo -v
sudo -n -H -u "$HERMES_USER" -- env XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" bash -s -- "$restart" <<'GATEWAY'
set -euo pipefail
export PATH="$HOME/.local/bin:$PATH"; cd "$HOME"
if ! systemctl --user cat hermes-gateway.service >/dev/null 2>&1; then hermes gateway install --no-start-now --start-on-login; fi
if ! systemctl --user is-enabled --quiet hermes-gateway.service; then systemctl --user enable hermes-gateway.service; fi
if systemctl --user is-active --quiet hermes-gateway.service; then
  started=$(LC_ALL=C systemctl --timestamp=us+utc --user show hermes-gateway.service -p ExecMainStartTimestamp --value)
  started=$(date -d "$started" +%s.%N)
  if [[ "$1" == 1 ]] || ! python3 -c 'import pathlib,sys; h=pathlib.Path.home()/".hermes"; sys.exit(any(p.exists() and p.stat().st_mtime>float(sys.argv[1]) for p in (h/"config.yaml",h/".env")))' "$started"; then
    read -r -p 'Gateway config changed or restart requested. Finish active work and type YES: ' answer </dev/tty
    [[ "$answer" == YES ]]
    hermes gateway restart
  else echo 'OK: gateway active, config predates process; no restart.'; fi
else hermes gateway start; fi
systemctl --user is-active hermes-gateway.service
systemctl --user show hermes-gateway.service -p ActiveState -p SubState -p MainPID -p Result
GATEWAY
'''

