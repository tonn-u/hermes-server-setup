[tasks.user]
description = "Create unprivileged Hermes runtime and enable user systemd"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: user: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
# sudo-rs can return 0 even when the listed user has no privileges.
# Require an explicit denial; unexpected output or auth failure is not success.
assert_no_sudo() {
  local account=$1 output rc=0 denied
  sudo -v || return 1
  output=$(LC_ALL=C sudo -n -l -U "$account" 2>&1) || rc=$?
  denied="User $account is not allowed to run sudo on "
  if [[ "$output" == "$denied"*"." && "$output" != *$'\n'* && ( "$rc" == 0 || "$rc" == 1 ) ]]; then
    printf 'OK: %s has no sudo privileges (list exit=%s)\n' "$account" "$rc"
    return 0
  fi
  printf 'FAIL: cannot confirm no sudo privileges for %s (exit=%s)\n%s\n' "$account" "$rc" "$output" >&2
  return 1
}
assert_safe_groups() {
  local group memberships
  memberships=$(id -nG "$1") || return 1
  for group in $memberships; do
    case "$group" in sudo|admin|wheel|docker|lxd|incus|disk|adm|libvirt|shadow) echo "Unsafe group for $1: $group" >&2; return 1;; esac
  done
}
[[ "$HERMES_USER" != "$ADMIN_USER" && "$HERMES_USER" != root ]]
if ! id "$HERMES_USER" >/dev/null 2>&1; then sudo adduser --disabled-password --gecos "" "$HERMES_USER"; fi
assert_safe_groups "$HERMES_USER"
assert_no_sudo "$HERMES_USER"
home=$(getent passwd "$HERMES_USER" | cut -d: -f6)
[[ "$home" == /home/hermes ]] && sudo test -d "$home" && sudo test ! -L "$home" || { echo 'Expected a real /home/hermes' >&2; exit 1; }
[[ $(sudo stat -c %U "$home") == hermes ]]
if [[ $(sudo stat -c %a "$home") != 700 ]]; then sudo chmod 700 "$home"; fi
sudo loginctl enable-linger "$HERMES_USER"
uid=$(id -u "$HERMES_USER")
sudo systemctl start "user@$uid.service"
[[ $(loginctl show-user "$HERMES_USER" -p Linger --value) == yes ]]
sudo test -S "/run/user/$uid/bus"
id "$HERMES_USER"
'''

[tasks.hermes-install]
description = "Install stable Hermes as unprivileged user"
interactive = true
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
trap 'rc=$?; printf "FAIL: hermes-install: script line %s, exit %s (see preceding output)\n" "$LINENO" "$rc" >&2' ERR
[[ $(id -u) != 0 && $(id -un) == "$ADMIN_USER" ]] || { echo "Run as $ADMIN_USER, not root" >&2; exit 1; }
umask 077
exec 9>"$HOME/.hermes-mise.lock"
flock -n 9 || { echo 'Another modifying mise task is running for this administrator.' >&2; exit 1; }
read -r -p 'Install Hermes if missing using the official installer? Type YES: ' answer
[[ "$answer" == YES ]]
cd / # target users cannot traverse the administrator home
uid=$(id -u "$HERMES_USER")
sudo -H -u "$HERMES_USER" -- env XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" bash -c 'set -euo pipefail; export PATH="$HOME/.local/bin:$PATH"; cd "$HOME";
if command -v hermes >/dev/null; then hermes --version; exit 0; fi
tmp=$(mktemp); trap "rm -f \"$tmp\"" EXIT
curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o "$tmp"
bash "$tmp" --non-interactive
hermes --version
'
'''

